# UniAssist monorepo — run all services from repo root:
#   docker compose up --build
#
# Services:
#   db          pgvector/pgvector:pg16  → localhost:5432
#   ai-service  AI FastAPI              → localhost:8000
#   backend     UniAssist API           → localhost:8001

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: uniassist-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-uniassist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniassist} -d ${POSTGRES_DB:-uniassist}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: uniassist-ai
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    env_file:
      - ./ai-service/.env
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
    volumes:
      - ./ai-service/data:/app/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: uniassist-backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uniassist}:${POSTGRES_PASSWORD:-uniassist}@db:5432/${POSTGRES_DB:-uniassist}
      PYTHONPATH: /app:/ai-service
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
