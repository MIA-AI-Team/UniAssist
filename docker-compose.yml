# UniAssist monorepo — run all services from repo root:
#   docker compose up --build
#
# Services:
#   db          pgvector/pgvector:pg16  → localhost:5432
#   ai-service  AI FastAPI              → localhost:8000
#   backend     UniAssist API           → localhost:8001

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-uniassist}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniassist} -d ${POSTGRES_DB:-uniassist}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ai-service:
    build:
      context: ./AI-Service
      dockerfile: Dockerfile
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    env_file:
      - path: ./AI-Service/.env
        required: false
    environment:
      MOCK_MODE: ${MOCK_MODE:-true}
    volumes:
      - ./AI-Service/data:/app/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uniassist}:${POSTGRES_PASSWORD:-uniassist}@db:5432/${POSTGRES_DB:-uniassist}
      PYTHONPATH: /app:/ai-service
      SECRET_KEY: ${SECRET_KEY:?Set a persistent backend SECRET_KEY in the root .env}
      MIN_COHORT_SIZE_FOR_PATTERNS: ${MIN_COHORT_SIZE_FOR_PATTERNS:-3}
      ANALYTICS_TIMEOUT_SECONDS: ${ANALYTICS_TIMEOUT_SECONDS:-90}
      MOCK_MODE: ${MOCK_MODE:-true}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uniassist}:${POSTGRES_PASSWORD:-uniassist}@db:5432/${POSTGRES_DB:-uniassist}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      target: runner
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Set a persistent frontend SESSION_SECRET of at least 32 characters}
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-180000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
